# 日志级别
logging.level.root=info

# DataSource settings: set URL for embedded database H2
spring.datasource.url=jdbc:h2:tcp://localhost/D:/Kwok/Work/GitHub/spring-boot-demo/h2db/spring-boot-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123456
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# H2 Console settings(H2-Web控制台配置)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

