server.port=8080
server.servlet.context-path=

# 日志
logging.level.root=info
logging.file.name=/opt/devops/spring-boot-demo/logs/log.txt
#logging.level.org.springframework=warn


# springboot-actuate 配置，生产环境请防止信息泄露和安全风险。
management.endpoints.enabled-by-default=true
management.endpoints.web.base-path=/monitor
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
# 通过接口 `shutdown` 服务，慎用！
management.endpoint.shutdown.enabled=true
management.info.env.enabled=true

# spring-boot-admin-starter-client 配置
spring.application.name=spring-boot-demo
# The admin server urls
spring.boot.admin.client.url=http://127.0.0.1:8080
spring.boot.admin.client.instance.service-host-type=ip


# 启用 Spring Security 配置
# 设置 Spring Security 默认用户名，缺省是 `user`。
spring.security.user.name=admin
# 设置 Spring Security 默认密码，缺省会打印在控制台。
spring.security.user.password=admin
spring.security.user.roles=ADMIN

